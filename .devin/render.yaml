services:
  - type: web
    name: saudiapedia
    runtime: node
    region: singapore
    plan: 1c-2g
    branch: main
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CMS_REQUIRED
        value: "true"
      - key: CMS_DB_PUSH
        value: "false"
      - key: CMS_ALLOW_BOOTSTRAP
        value: "false"
      - key: SITE_INDEXABLE
        value: "false"
      - key: CMS_DATABASE_CA_FILE
        value: /etc/secrets/supabase-ca.crt
      - key: DATABASE_URL
        sync: false
      - key: PAYLOAD_SECRET
        sync: false
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        generateValue: true
      - key: S3_BUCKET
        value: saudiapedia-media
      - key: S3_REGION
        value: ap-northeast-1
      - key: S3_ENDPOINT
        value: https://vexushpbyvaoangxyqcm.storage.supabase.co/storage/v1/s3
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
